name: publish @kyung-lee/authz

# Publishes the packages/authz package to npm when a tag matching
# `authz-v*` is pushed (e.g. `authz-v0.1.0`).
# Uses npm provenance for sigstore-signed public trust.
# Requires the `NPM_TOKEN` repo secret (npm automation token).

on:
  push:
    tags:
      - "authz-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/authz
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Create GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true